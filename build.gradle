    runtimeOnly("curse.maven:apothic-attributes-898963:${apothic_attributes_version}")

    // AgentDriver（本地开发用的自动化测试挂钩）只在显式开启时进 runtime：
    // -PwithAgentDriver，或在 gradle.properties 里写 withAgentDriver=true。
    // 不看 ~/.m2 里有没有这个构件：那样同一份代码在不同机器上会跑出不同的模组集合。
    // 取值判断而非仅判存在，否则 gradle.properties 里写 withAgentDriver=false 也会照开。
    def agentDriverFlag = project.findProperty("withAgentDriver")?.toString()
    if (agentDriverFlag != null && agentDriverFlag != "false") {
        def agentDriverLocal = file("${System.getProperty('user.home')}/.m2/repository" +
                "/net/magicterra/agent_driver-neoforge/${agent_driver_version}")
        if (!agentDriverLocal.exists()) {
            throw new GradleException("withAgentDriver 已开启，但本地 Maven 仓库里没有 " +
                    "net.magicterra:agent_driver-neoforge:${agent_driver_version}（${agentDriverLocal}）")
        }
        logger.lifecycle("AgentDriver ${agent_driver_version} 已加入 runtime（-PwithAgentDriver）")
        runtimeOnly("net.magicterra:agent_driver-neoforge:${agent_driver_version}") {
            // Rhino is already shaded into the AgentDriver jar; avoid a second copy on the classpath.
            exclude group: "dev.latvian.mods", module: "rhino"
        }
    }
}

// 仅开发环境：Somake 的 PlayerFamiliarDataMixin 与 FamiliarManagerMixin 面向 FamiliarsLib 1.x，
// 2.0 已删除其 @Overwrite / @Shadow 的目标（canTameMoreFamiliars、tamedFamiliars、getFamiliarCount），
// 而 SomakeMixinPlugin 在同时安装 FamiliarsLib 与 Alshanex's Familiars 时必然应用它们，导致 Mixin 应用失败。
// 回退到 FamiliarsLib 1.7.1 会使 Alshanex's Familiars 缺少 FamiliarPhoto，因此改为在运行时 classpath 中
// 使用一份从 mixin 配置里移除这两项的 Somake。仅作用于 runtimeClasspath，不影响编译类路径与发布 jar。
def somakePatchSource = configurations.detachedConfiguration(
        dependencies.create("curse.maven:somake-spells-irons-spells-addon-1461634:${somake_spells_version}"))
somakePatchSource.transitive = false
def devPatchedSomake = tasks.register('devPatchedSomake', Zip) {
    group = 'development'
    description = '生成移除了与 FamiliarsLib 2.0 冲突的 mixin 的 Somake（仅供开发环境运行时使用）'
    archiveFileName = "somake-spells-dev-patched-${somake_spells_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('devpatch')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(somakePatchSource.singleFile) }) {
        // mixin 配置每行一项，整行删除即可
        filesMatching('somakespells.mixins.json') {
            filter { String line ->
                (line.contains('"PlayerFamiliarDataMixin"') || line.contains('"FamiliarManagerMixin"')) ? null : line
            }
        }
    }
}
configurations.runtimeClasspath {
    exclude group: 'curse.maven', module: 'somake-spells-irons-spells-addon-1461634'
}
dependencies {
    runtimeOnly(files(devPatchedSomake))
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            neo_version                     : neo_version,
            neo_version_range               : neo_version_range,
            loader_version_range            : loader_version_range,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description,
            irons_spells_version_range      : irons_spells_version_range,
            touhou_little_maid_version_range: touhou_little_maid_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

createMinecraftArtifacts {
    dependsOn generateModMetadata
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogForVersion(String version) {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return version
    }

    def lines = changelogFile.readLines()
    def versionHeader = "## ${version}"
    def inVersionSection = false
    def changelog = new StringBuilder()

    for (line in lines) {
        if (line.trim() == versionHeader) {
            inVersionSection = true
            continue
        }
        if (inVersionSection) {
            if (line.trim() == "---") {
                break
            }
            changelog.append(line).append('\n')
        }
    }

    return changelog.toString().trim()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = mod_id
    // versionNumber = "1.0.0"
    versionType = version_type
    uploadFile = jar
    changelog = getChangelogForVersion(mod_version)
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    dependencies {
        required.project "touhou-little-maid"
        required.project "irons-spells-n-spellbooks"
    }
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def mainFile = upload(curseforge_project, jar)
    mainFile.changelog = getChangelogForVersion(mod_version)
    mainFile.releaseType = version_type
    mainFile.addGameVersion(minecraft_version)
    // CurseForge 要求每个文件至少带一个 environment 组的版本，缺了会被 API 以 1021 拒收；
    // 本模组客户端与服务端都要装，两个都标
    mainFile.addGameVersion('Client', 'Server')
    mainFile.addModLoader('neoforge')
    mainFile.addRequirement('touhou-little-maid', 'irons-spells-n-spellbooks')
    mainFile.withAdditionalFile(sourcesJar)
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to both Modrinth and CurseForge'
    dependsOn 'runData', 'modrinth', 'publishCurseForge'
}

tasks.register('cleanLibs', Delete) {
    delete layout.projectDirectory.dir('agent_context/libs')
}

tasks.register('exportClasspath', Copy) {
    dependsOn 'cleanLibs'
    from configurations.compileClasspath
    into layout.projectDirectory.dir('agent_context/libs')
}
